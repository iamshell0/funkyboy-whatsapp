services:
  dolphin:
    image: ollama/ollama
    container_name: dolphin-wa
    restart: unless-stopped
    volumes:
      - ./ollama-data:/root/.ollama
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  bot:
    build: ./bot
    container_name: dolphin-wa-bot
    restart: unless-stopped
    depends_on:
      - dolphin
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://dolphin-wa:11434
      - OLLAMA_MODEL=dolphin-unleashed
      - THINKING_MSG=${THINKING_MSG:-un momento...}
    volumes:
      - wa-auth:/app/auth

volumes:
  wa-auth:
