services:
  bot:
    build: ./bot
    container_name: funkyboy-whatsapp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LLM_URL=${LLM_URL:-http://localhost:8080/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5-9b}
      - LLM_API_KEY=${LLM_API_KEY:-sk-local}
      - IMG_URL=${IMG_URL:-}
      - IMG_MODEL=${IMG_MODEL:-}
      - IMAGE_TRIGGERS=${IMAGE_TRIGGERS:-/imagen,/img,/draw}
      - THINKING_MSG=${THINKING_MSG:-Thinking...}
      - IMAGE_THINKING_MSG=${IMAGE_THINKING_MSG:-Generando imagen...}
      - SEARCH_URL=${SEARCH_URL:-}
      - PROMPTS_DIR=/app/prompts
    volumes:
      - wa-auth:/app/auth
      - ./prompts:/app/prompts:ro,Z

volumes:
  wa-auth:
