services:
  bot:
    build: ./bot
    container_name: funkyboy-whatsapp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FUNKYBOY_URL=http://${FUNKYBOY_LOCAL_MODEL_HOST:-funkyboy-local-model}:${FUNKYBOY_LOCAL_MODEL_PORT:-8080}
      - THINKING_MSG=${THINKING_MSG:-un momento...}
    volumes:
      - wa-auth:/app/auth

volumes:
  wa-auth:

networks:
  default:
    name: ${FUNKYBOY_LOCAL_MODEL_HOST:-funkyboy-local-model}-net
    external: true
